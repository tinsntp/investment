    background-repeat: no-repeat;

  .category-select option {

  /* Stats Comparison Header */

  .chart-wrapper {

<script>
  // Global States
  let sheetData = [];
  let headers = [];
  let iconURLs = []; // Row 1 URLs
  let myChart = null;
  let currentRange = 'Year';
  let selectedColIdx = 2;

  // Sheet GID & Config
  const SPREADSHEET_ID = '12S4GIn9m3XwB2I1o782vW848n14iL9I'; // Replace with your Spreadsheet ID
  const GID = '1608160084';

  // Fetch CSV Data on Load
  document.addEventListener('DOMContentLoaded', () => {
    fetchSheetCSV();
  });

  function fetchSheetCSV() {
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQnzbOhfKNO_niIpBIoReyDiy5p-UdXvtO6SIMNKXrZts9Cax9hR_5F7RqB_uejrjZuyV6N-Pjc08kd/pub?output=csv&gid=1608160084";

    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error('Network response error');
        return res.text();
      })
      .then(csvText => {
        parseCSVData(csvText);
      })
      .catch(err => {
        console.error("CSV fetch failed, loading fallback:", err);
        loadFallbackData();
      });
  }

  function parseCSVLine(line) {
    const values = [];
    let currentVal = '';
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"' && line[i + 1] === '"') {
        currentVal += '"';
        i++;
      } else if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        values.push(currentVal.trim());
        currentVal = '';
      } else {
        currentVal += char;
      }
    }
    values.push(currentVal.trim());
    return values;
  }

  function parseCSVData(csvText) {
    const lines = csvText.trim().split(/\r?\n/);
    if (lines.length < 3) return; // Row 1: Icons, Row 2: Headers, Row 3+: Data

    // Row 1 -> Icon URLs, Row 2 -> Column Headers
    iconURLs = parseCSVLine(lines[0]);
    headers = parseCSVLine(lines[1]);

    buildCustomCategoryDropdown(headers, iconURLs);

    const now = new Date();
    const currentYear = now.getFullYear() % 100; // e.g. 26
    const currentMonth = now.getMonth() + 1;

    sheetData = [];

    lines.slice(2).forEach(line => {
      const parsedRow = parseCSVLine(line);
      const dateStr = parsedRow[0]; // Col A: MM/yy

      if (!dateStr) return;

      // Filter future months
      let isFuture = false;
      if (dateStr.includes('/')) {
        const parts = dateStr.split('/');
        const m = parseInt(parts[0], 10);
        const y = parseInt(parts[1], 10);

        if (!isNaN(m) && !isNaN(y)) {
          if (y > currentYear || (y === currentYear && m > currentMonth)) {
            isFuture = true;
          }
        }
      }

      if (isFuture) return;

      const rowObj = { 0: dateStr };

      parsedRow.forEach((cellVal, idx) => {
        if (idx === 0) return;

        if (!cellVal) {
          rowObj[idx] = 0;
        } else {
          let clean = cellVal.replace(/[\$,\s]/g, '');
          if (clean.startsWith('(') && clean.endsWith(')')) {
            clean = '-' + clean.slice(1, -1);
          }
          const num = parseFloat(clean);
          rowObj[idx] = isNaN(num) ? 0 : num;
        }
      });

      sheetData.push(rowObj);
    });

    renderWidget();
  }

  function buildCustomCategoryDropdown(colHeaders, urls) {
    const menu = document.getElementById('dropdownMenu');
    menu.innerHTML = '';

    const categories = [];

    // Add Total Expense (Col 2 / C)
    categories.push({
      idx: 2,
      label: colHeaders[2] || 'Total Expense',
      icon: urls[2] || '',
      type: 'total'
    });

    // Add Main Categories (Cols 3 to 8)
    colHeaders.forEach((label, idx) => {
      if (!label || idx < 3) return;

      if (idx >= 3 && idx <= 8) {
        categories.push({ idx, label, icon: urls[idx] || '', type: 'main' });
      }
    });

    // Add Sub Categories (Cols 9+)
    colHeaders.forEach((label, idx) => {
      if (!label || idx < 9) return;
      categories.push({ idx, label, icon: urls[idx] || '', type: 'sub' });
    });

    let currentGroup = '';

    categories.forEach(item => {
      // Add a line divider between Total, Main Categories, and Sub Categories
      if (item.type === 'main' && currentGroup !== 'main') {
        currentGroup = 'main';
        const divider = document.createElement('hr');
        divider.className = 'dropdown-divider';
        menu.appendChild(divider);
      } else if (item.type === 'sub' && currentGroup !== 'sub') {
        currentGroup = 'sub';
        const divider = document.createElement('hr');
        divider.className = 'dropdown-divider';
        menu.appendChild(divider);
      }

      const itemEl = document.createElement('div');
      itemEl.className = `dropdown-item ${item.idx === selectedColIdx ? 'selected' : ''}`;
      itemEl.onclick = () => selectCategory(item.idx, item.label, item.icon);

      if (item.icon) {
        const img = document.createElement('img');
        img.src = item.icon;
        img.className = 'cat-icon';
        img.alt = '';
        itemEl.appendChild(img);
      }

      const span = document.createElement('span');
      span.textContent = item.label;
      itemEl.appendChild(span);

      menu.appendChild(itemEl);
    });

    // Set initial active selection (Total Expense)
    selectCategory(selectedColIdx, categories[0].label, categories[0].icon, false);
  }

  function createGroupHeader(text) {
    const header = document.createElement('div');
    header.className = 'dropdown-group-header';
    header.textContent = text;
    return header;
  }

  function selectCategory(colIdx, label, iconUrl, shouldRender = true) {
    selectedColIdx = colIdx;

    // Update Header Display Trigger
    const selectedLabel = document.getElementById('selectedLabel');
    const selectedIcon = document.getElementById('selectedIcon');

    selectedLabel.textContent = label;

    if (iconUrl) {
      selectedIcon.src = iconUrl;
      selectedIcon.style.display = 'block';
    } else {
      selectedIcon.style.display = 'none';
    }

    // Update active highlight class in menu
    document.querySelectorAll('.dropdown-item').forEach(el => {
      el.classList.remove('selected');
    });

    closeDropdown();

    if (shouldRender) {
      renderWidget();
    }
  }

  function toggleDropdown() {
    const menu = document.getElementById('dropdownMenu');
    const dropdown = document.getElementById('customDropdown');
    menu.classList.toggle('show');
    dropdown.classList.toggle('open');
  }

  function closeDropdown() {
    const menu = document.getElementById('dropdownMenu');
    const dropdown = document.getElementById('customDropdown');
    menu.classList.remove('show');
    dropdown.classList.remove('open');
  }

  // Close dropdown if user clicks outside
  document.addEventListener('click', (e) => {
    const wrap = document.querySelector('.category-select-wrap');
    if (wrap && !wrap.contains(e.target)) {
      closeDropdown();
    }
  });

  function handleCategoryChange(val) {
    selectedColIdx = parseInt(val, 10);
    renderWidget();
  }

  function updateView(range, btn) {
    currentRange = range;
    document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderWidget();
  }
  function formatShortCurrency(value) {
    const absVal = Math.abs(value);
    const sign = value < 0 ? '-' : '';

    if (absVal >= 1e6) {
      return sign + '$' + (absVal / 1e6).toFixed(1) + 'M';
    } else if (absVal >= 1e3) {
      return sign + '$' + (absVal / 1e3).toFixed(1) + 'k';
    }
    return sign + '$' + absVal.toFixed(0);
  }

  function renderWidget() {
    if (!sheetData || sheetData.length === 0) return;

    let activeData = [...sheetData];

    if (currentRange === '6M') {
      activeData = activeData.slice(-6);
    } else if (currentRange === 'Year') {
      activeData = activeData.slice(-12);
    }

    const rawLabels = activeData.map(d => d[0]); // e.g. ["01/26", "02/26"]
    const currentValues = activeData.map(d => Math.abs(Number(d[selectedColIdx]) || 0));

    // Match corresponding 2025 values for baseline line
    const baselineValues = rawLabels.map(label => {
      if (!label || !label.includes('/')) return 0;
      const monthStr = label.split('/')[0].trim();
      const target2025Label = `${monthStr}/25`;

      const match2025 = sheetData.find(d => d[0] === target2025Label);
      return match2025 ? Math.abs(Number(match2025[selectedColIdx]) || 0) : 0;
    });

    // DIRECT DISPLAY CHANGE: MM/YY -> MM
    const formattedChartLabels = rawLabels.map(l => l.includes('/') ? l.split('/')[0].padStart(2, '0') : l);

    // Calculate Summary Totals
    const totalCurr = currentValues.reduce((a, b) => a + b, 0);
    const totalBaseline = baselineValues.reduce((a, b) => a + b, 0);

    document.getElementById('currPeriodVal').innerHTML = formatCurrencyResponsive(totalCurr);
    document.getElementById('prevPeriodVal').innerHTML = formatCurrencyResponsive(totalBaseline);

    if (rawLabels.length > 0) {
      document.getElementById('currPeriodSub').innerText = rawLabels[rawLabels.length - 1] || 'For Now';
      document.getElementById('prevPeriodSub').innerText = 'Same Period 2025';
    }

    drawChart(formattedChartLabels, rawLabels, currentValues, baselineValues);
  }

  function drawChart(chartLabels, rawLabels, currentValues, baselineValues) {
    const ctx = document.getElementById('expenseChart').getContext('2d');

    if (myChart) {
      myChart.destroy();
    }

    // Pink Theme Gradients
    const pinkGradient = ctx.createLinearGradient(0, 0, 300, 0);
    pinkGradient.addColorStop(0, '#ff528e');
    pinkGradient.addColorStop(1, '#e0407b');

    const fillGradient = ctx.createLinearGradient(0, 0, 0, 220);
    fillGradient.addColorStop(0, 'rgba(255, 82, 142, 0.3)');
    fillGradient.addColorStop(1, 'rgba(24, 25, 40, 0.0)');

    // Vertical Line Plugin on Hover
    const verticalHoverLinePlugin = {
      id: 'verticalHoverLine',
      afterDraw: (chart) => {
        if (chart.tooltip?._active?.length) {
          const activePoint = chart.tooltip._active[0];
          const x = activePoint.element.x;
          const yAxis = chart.scales.y;
          const ctx = chart.ctx;

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(x, yAxis.top);
          ctx.lineTo(x, yAxis.bottom);
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.stroke();
          ctx.restore();
        }
      }
    };

    // Index of latest month to show number on point
    const lastIndex = currentValues.length - 1;

    myChart = new Chart(ctx, {
      type: 'line',
      plugins: [verticalHoverLinePlugin, ChartDataLabels],
      data: {
        labels: chartLabels,
        datasets: [
          {
            label: 'Current',
            data: currentValues,
            borderColor: pinkGradient,
            borderWidth: 3.5,
            backgroundColor: fillGradient,
            fill: true,
            tension: 0.35,
            pointRadius: (ctx) => (ctx.dataIndex === lastIndex ? 5 : 2),
            pointBackgroundColor: (ctx) => (ctx.dataIndex === lastIndex ? '#ff528e' : 'transparent'),
            pointBorderColor: (ctx) => (ctx.dataIndex === lastIndex ? '#ffffff' : 'transparent'),
            pointBorderWidth: 2,
            pointHoverRadius: 7,
            pointHoverBackgroundColor: '#ff528e',
            pointHoverBorderColor: '#ffffff',
            pointHoverBorderWidth: 3,
            order: 1,
            // Point DataLabel configuration
            datalabels: {
              display: (ctx) => ctx.dataIndex === lastIndex, // Only show on current/last month
              align: 'top',
              anchor: 'end',
              offset: 6,
              backgroundColor: '#ff528e',
              borderRadius: 6,
              color: '#ffffff',
              font: { family: 'DM Sans', size: 11, weight: 'bold' },
              padding: { top: 3, bottom: 3, left: 6, right: 6 },
              formatter: (val) => {
                if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M đ';
                if (val >= 1000) return (val / 1000).toFixed(0) + 'K đ';
                return val.toLocaleString('vi-VN') + ' đ';
              }
            }
          },
          {
            label: 'Baseline',
            data: baselineValues,
            borderColor: 'rgba(142, 144, 166, 0.55)',
            borderWidth: 2,
            fill: false,
            tension: 0.35,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: '#8e90a6',
            pointHoverBorderColor: '#ffffff',
            pointHoverBorderWidth: 2,
            order: 2,
            datalabels: { display: false } // Hide datalabels for baseline
          }
        ]
      },
      options: {
  responsive: true,
  maintainAspectRatio: false,
  interaction: {
    mode: 'index',
    intersect: false
  },
  plugins: {
    legend: { display: false },
    tooltip: {
      enabled: true,
      backgroundColor: '#ffffff',
      titleColor: '#181928',
      bodyColor: '#181928',
      titleAlign: 'center',
      titleFont: { size: 11, family: 'DM Sans', weight: 'normal' },
      bodyFont: { size: 13, family: 'DM Sans', weight: 'bold' },
      displayColors: true,
      boxWidth: 8,
      boxHeight: 8,
      usePointStyle: true,
      cornerRadius: 12,
      padding: 10,
      caretSize: 6,
      callbacks: {
        title: function(items) {
          const idx = items[0].dataIndex;
          return '' + rawLabels[idx];
        },
        label: function(context) {
          let labelName = context.dataset.label || '';
          let val = context.raw || 0;
          
          // Check for iPhone / Mobile viewport
          const isMobile = window.innerWidth <= 480;
          let formattedVal = '';

          if (isMobile) {
            const absVal = Math.abs(val);
            const sign = val < 0 ? '-' : '';
            
            if (absVal >= 1e9) {
              formattedVal = sign + (absVal / 1e9).toFixed(1) + ' tỷ đ';
            } else if (absVal >= 1e6) {
              // 12.500.000 -> 12.5 tr đ
              const formatted = (absVal / 1e6).toFixed(1).replace('.0', '');
              formattedVal = sign + formatted + 'M đ';
            } else if (absVal >= 1e3) {
              // 500.000 -> 500k đ
              const formatted = (absVal / 1e3).toFixed(0);
              formattedVal = sign + formatted + 'K đ';
            } else {
              formattedVal = sign + Math.round(absVal) + ' đ';
            }
          } else {
            // Full precision for Desktop / Tablet
            formattedVal = Math.round(val).toLocaleString('vi-VN') + ' đ';
          }

          return `${labelName}: ${formattedVal}`;
        }
      }
    }
  },
  scales: {
    x: {
      grid: { display: false },
      ticks: {
        color: '#8e90a6',
        font: { size: 11, family: 'DM Sans' }
      }
    },
    y: {
      display: false,
      grace: '15%' // Extra top spacing for point label badge
    }
  }
}
    });
  }

  function updateHeaderDisplay(currVal, prevVal, currSub, prevSub) {
    document.getElementById('currPeriodVal').innerHTML = formatCurrencyResponsive(currVal);
    document.getElementById('prevPeriodVal').innerHTML = formatCurrencyResponsive(prevVal);
    document.getElementById('currPeriodSub').innerText = currSub;
    document.getElementById('prevPeriodSub').innerText = prevSub;
  }

  function formatCurrencyResponsive(val) {
    const isDesktopOrTablet = window.innerWidth > 400;

    if (isDesktopOrTablet) {
      return Math.round(val).toLocaleString('vi-VN') + '<span class="unit"> đ</span>';
    } else {
      if (val >= 1000000) {
        return (val / 1000000).toFixed(2) + '<span class="unit">M đ</span>';
      } else if (val >= 1000) {
        return (val / 1000).toFixed(0) + '<span class="unit">K đ</span>';
      }
      return Math.round(val).toLocaleString('en-US') + '<span class="unit">đ</span>';
    }
  }

  

  window.addEventListener('resize', () => {
    if (sheetData.length > 0) renderWidget();
  });

  function loadFallbackData() {
    const dummyLabels = ['01/26', '02/26', '03/26', '04/26', '05/26', '06/26', '07/26'];
    const dummyVals = [18200000, 21400000, 19500000, 24000000, 22100000, 28500000, 31000000];
    
    sheetData = dummyLabels.map((lbl, idx) => ({
      0: lbl,
      2: dummyVals[idx]
    }));
    
    renderWidget();
  }
</script>
